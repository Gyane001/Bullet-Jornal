<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Planner</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <button
                class="icon-button"
                id="menuButton"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="sideMenu"
            >
                ☰
            </button>

            <div class="brand">
                <span class="brand-mark">✦</span>
                <div>
                    <strong>Meu Planner</strong>
                    <small>Organize seus dias</small>
                </div>
            </div>
        </header>

        <aside class="side-menu" id="sideMenu" aria-hidden="true">
            <div class="side-menu-header">
                <div>
                    <strong>Menu</strong>
                    <small>Navegação rápida</small>
                </div>

                <button
                    class="icon-button small"
                    id="closeMenuButton"
                    type="button"
                    aria-label="Fechar menu"
                >
                    ×
                </button>
            </div>

            <nav>
                <a class="menu-item active" href="../index.html">
                    <span>Menu Principal</span></a>

                <a class="menu-item active" href="./PAGES/calendario.html">
                    <span>Calendário</span>
                </a>

                <button class="menu-item" type="button" data-menu-action="customize">
                    ✦ <span>Personalizar</span>
                </button>

                <button class="menu-item" type="button" data-menu-action="themes">
                    ◐ <span>Temas</span>
                </button>

                <button class="menu-item" type="button" data-menu-action="future">
                    ☷ <span>Configurações futuras</span>
                </button>
            </nav>
        </aside>

        <div class="menu-overlay" id="menuOverlay"></div>
    </div>

    <script src="./JS/script.js"></script>
</body>
</html>
